name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "Dockerfile"
      - "docker-compose*.yml"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Tests & Quality Checks
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        working-directory: backend
        run: |
          pytest -v

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Build Docker Image & Deploy to AWS ECS Fargate
  # ────────────────────────────────────────────────────────────────────────────
  deploy-to-aws:
    name: Build Docker & Deploy to AWS
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'snapsend-api' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker buildx build \
            --platform linux/arm64 \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            -f backend/Dockerfile \
            --push \
            backend/

      - name: Deploy to AWS ECS Fargate
        env:
          CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME || 'snapsend-cluster' }}
          SERVICE_NAME: ${{ secrets.ECS_SERVICE_NAME || 'snapsend-service' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          echo "Triggering new deployment on ECS Cluster: $CLUSTER_NAME, Service: $SERVICE_NAME"
          aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --force-new-deployment \
            --region "$AWS_REGION"

          echo "Waiting for ECS service to reach steady state..."
          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --region "$AWS_REGION"

          echo "Deployment succeeded! Production container is live on AWS ECS."
