name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "Dockerfile"
      - "docker-compose*.yml"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Tests & Quality Checks
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        working-directory: backend
        run: |
          pytest -v

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Build Docker Image & Deploy to AWS
  # ────────────────────────────────────────────────────────────────────────────
  deploy-to-aws:
    name: Build Docker & Deploy to AWS
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'snapsend-api' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            -f backend/Dockerfile \
            backend/
          
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Trigger AWS App Runner Deployment
        if: env.APP_RUNNER_SERVICE_ARN != '' || secrets.APP_RUNNER_SERVICE_ARN != ''
        env:
          SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
        run: |
          if [ -z "$SERVICE_ARN" ]; then
            echo "Notice: APP_RUNNER_SERVICE_ARN secret not set yet. Skipping App Runner trigger."
            exit 0
          fi

          echo "Starting App Runner deployment for service: $SERVICE_ARN"
          DEPLOYMENT_ID=$(aws apprunner start-deployment \
            --service-arn "$SERVICE_ARN" \
            --query "OperationId" \
            --output text)
          echo "Deployment initiated. Operation ID: $DEPLOYMENT_ID"

          echo "Monitoring deployment progress..."
          for i in {1..30}; do
            STATUS=$(aws apprunner describe-service \
              --service-arn "$SERVICE_ARN" \
              --query "Service.Status" \
              --output text)
            echo "Current App Runner status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "Deployment succeeded! Service is RUNNING and passed health checks."
              SERVICE_URL=$(aws apprunner describe-service \
                --service-arn "$SERVICE_ARN" \
                --query "Service.ServiceUrl" \
                --output text)
              echo "Production URL: https://$SERVICE_URL"
              break
            elif [ "$STATUS" = "OPERATION_IN_PROGRESS" ]; then
              sleep 15
            else
              echo "Warning: Service status is $STATUS. Checking service details..."
              sleep 10
            fi
          done
