name: Backend CI/CD Pipeline

on:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        working-directory: backend
        run: |
          pytest -v

  deploy-to-aws:
    name: Build Docker & Deploy to AWS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        run: |
          CLEAN_REGISTRY=$(echo "${{ steps.login-ecr.outputs.registry }}" | tr -d '\r\n[:space:]')
          CLEAN_REPO=$(echo "${{ secrets.ECR_REPOSITORY || 'snapsend-api' }}" | tr -d '\r\n[:space:]')
          CLEAN_TAG=$(echo "${{ github.sha }}" | tr -d '\r\n[:space:]')
          
          IMAGE_TAGGED="$CLEAN_REGISTRY/$CLEAN_REPO:$CLEAN_TAG"
          IMAGE_LATEST="$CLEAN_REGISTRY/$CLEAN_REPO:latest"
          
          echo "Building Docker image: $IMAGE_TAGGED"
          docker buildx build \
            --platform linux/arm64 \
            -t "$IMAGE_TAGGED" \
            -t "$IMAGE_LATEST" \
            -f backend/Dockerfile \
            --push \
            backend/

      - name: Deploy to AWS ECS Fargate
        run: |
          CLEAN_CLUSTER=$(echo "${{ secrets.ECS_CLUSTER_NAME || 'snapsend-cluster' }}" | tr -d '\r\n[:space:]')
          CLEAN_SERVICE=$(echo "${{ secrets.ECS_SERVICE_NAME || 'snapsend-service' }}" | tr -d '\r\n[:space:]')
          CLEAN_REGION=$(echo "${{ secrets.AWS_REGION || 'ap-south-1' }}" | tr -d '\r\n[:space:]')

          echo "Triggering deployment on ECS Cluster: $CLEAN_CLUSTER, Service: $CLEAN_SERVICE (Region: $CLEAN_REGION)"
          aws ecs update-service \
            --cluster "$CLEAN_CLUSTER" \
            --service "$CLEAN_SERVICE" \
            --force-new-deployment \
            --region "$CLEAN_REGION"

          echo "Waiting for ECS service to reach steady state..."
          aws ecs wait services-stable \
            --cluster "$CLEAN_CLUSTER" \
            --service "$CLEAN_SERVICE" \
            --region "$CLEAN_REGION"

          echo "Deployment succeeded! Production container is live on AWS ECS."
