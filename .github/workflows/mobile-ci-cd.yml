name: Mobile Android APK CI/CD

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (production or preview)"
        required: true
        default: "production"
        type: choice
        options:
          - "production"
          - "preview"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typecheck:
    name: TypeScript Check & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"

      - name: Install Dependencies
        working-directory: mobile
        run: npm ci

      - name: Run TypeScript Check
        working-directory: mobile
        run: npm run typecheck

  build-apk:
    name: Build Standalone Android APK
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"

      - name: Install Dependencies
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android Standalone APK
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ github.event.inputs.profile || 'production' }}
        run: |
          CLEAN_TOKEN=$(echo "$EXPO_TOKEN" | tr -d '\r\n[:space:]')
          if [ -z "$CLEAN_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set in repository secrets!"
            echo "Create an Expo Access Token at https://expo.dev/settings/access-tokens and add it to GitHub Secrets."
            exit 1
          fi

          export EXPO_TOKEN="$CLEAN_TOKEN"
          echo "Starting EAS build for Android profile: $PROFILE"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive
